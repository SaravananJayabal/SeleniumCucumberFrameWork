name: Selenium Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  selenium-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Maven
        run: mvn -version

      - name: Run Selenium Tests
        run: mvn test